<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>劫禾 · 资源中心</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--side:#0b0d14;--panel:#10121b;--panel2:#151826;--line:#1f2334;--ink:#e9ebf7;--sub:#8b91ad;--mut:#5b617c;--pri:#7b7bff;--sky:#46c2ff;--vio:#b07bff;--barbg:rgba(7,8,13,.82);--openline:#34396a;--glow1:rgba(123,123,255,.16);--glow2:rgba(70,194,255,.08);--tint:rgba(123,123,255,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="light"]{color-scheme:light;--bg:#f3f4fb;--side:#ffffff;--panel:#ffffff;--panel2:#f5f6fc;--line:#e1e4f0;--ink:#171a2e;--sub:#586080;--mut:#8a90aa;--pri:#5b5bf0;--sky:#1d9bf0;--vio:#8f5bf0;--barbg:rgba(243,244,251,.85);--openline:#b9bcf5;--glow1:rgba(91,91,240,.12);--glow2:rgba(29,155,240,.07);--tint:rgba(91,91,240,.1)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;font-size:14px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 360px at 85% -5%,var(--glow1),transparent 70%),radial-gradient(500px 300px at 0% 100%,var(--glow2),transparent 70%)}
.av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(140deg,var(--pri),var(--vio));box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 6px 18px rgba(123,123,255,.35)}
.brand{display:flex;align-items:center;gap:11px}
.brand b{display:block;font-size:16px;letter-spacing:.06em}
.brand small{color:var(--mut);font-size:12px}
aside{position:fixed;z-index:30;left:0;top:0;bottom:0;width:236px;background:var(--side);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:22px;transform:translateX(-100%);transition:transform .3s ease}
aside.on{transform:none}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.grp{color:var(--mut);font-size:12px;padding:0 10px 8px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:600;position:relative}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover,.nav a:focus-visible,.nav a.cur{background:var(--panel2);color:var(--ink);outline:none}
.nav a.cur:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--sub);font-size:12px;line-height:1.7}
.foot b{color:var(--ink)}
.wrap{position:relative;z-index:1}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--barbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .brand{display:flex}
.mbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.tbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.tbtn:hover,.tbtn:focus-visible{border-color:var(--pri);outline:none}
.tbtn svg{width:18px;height:18px}
.tbtn .sun{display:none}
[data-theme="light"] .tbtn .sun{display:block}
[data-theme="light"] .tbtn .moon{display:none}
body,.bar,aside,.card,.row,.btn,.kvr,.stat,.search,.tbtn{transition:background-color .3s,border-color .3s,color .3s}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;width:min(240px,48%)}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit}
.search svg{width:16px;height:16px;color:var(--mut);flex:none}
main{padding:20px 16px 60px;max-width:1120px;margin:0 auto}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.02em}
.lead{margin:0 0 20px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--mut);font-size:12px}
.stat b{display:block;margin-top:6px;font-size:22px}
.stat b i{font-style:normal;font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.cols{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.kvr{justify-content:flex-start}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.card h2 span{color:var(--mut);font-size:12px;font-weight:500}
.row{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
.row.open{border-color:var(--openline)}
.top{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.top:focus-visible{outline:2px solid var(--pri);outline-offset:-3px;border-radius:12px}
.ic{width:32px;height:32px;border-radius:9px;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:none}
.ic svg{width:17px;height:17px}
.tags{margin-left:auto;display:none;gap:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--sub);background:var(--panel)}
.chev{color:var(--mut);transition:transform .25s;flex:none;display:grid}
.row.open .chev{transform:rotate(180deg);color:var(--pri)}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.row.open .pn{grid-template-rows:1fr}
.pn>div{overflow:hidden}
.desc{margin:0 14px 12px;padding-top:12px;border-top:1px solid var(--line);color:var(--sub);line-height:1.8}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.btn{flex:1 1 92px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover,.btn:focus-visible{border-color:var(--pri);background:var(--tint);outline:none}
a.btn{display:grid;place-items:center;text-decoration:none;text-align:center}
.btn.off{color:var(--mut);cursor:default}
.btn.off:hover{border-color:var(--line);background:var(--panel)}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--vio));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.1)}
.kv{display:flex;flex-direction:column;gap:8px}
.kvr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;text-align:left;width:100%}
.kvr>div{flex:1;min-width:0}
.ki{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:none}
.ki svg{width:18px;height:18px}
.ki.tg{background:rgba(70,194,255,.15);color:var(--sky)}
.kvr small{color:var(--mut);display:block;font-size:12px}
.kvr b{font-size:16px}
.kvr span.go{color:var(--sub);font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;flex:none}
.kvr:hover,.kvr:focus-visible{border-color:var(--pri);outline:none}
.about{margin:0;color:var(--sub);line-height:1.9}
.empty{display:none;text-align:center;color:var(--mut);padding:22px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--pri);color:var(--ink);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.on{opacity:1}
@media (min-width:640px){.tags{display:flex}}
@media (min-width:900px){
 aside{transform:none}
 .scrim,.mbtn,.bar .brand{display:none}
 .wrap{margin-left:236px}
 .bar{padding-left:28px;padding-right:28px}
 .search{margin-left:0;width:300px}
 .tbtn{margin-left:auto}
 main{padding:28px 28px 60px}
 .cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
 .stack{position:sticky;top:84px}
}
.stack{display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<script>
var items=[
 {n:"玩机资源",d:"顾名思义，玩机应用工具等等。",q:"https://pan.quark.cn/s/f2f116234d57",x:"https://pan.xunlei.com/s/VP2rcjrF_wld3Es-NPWL-nYDA1?pwd=sdde#",t:""},
 {n:"自用耳机",d:"🐷包本人目前在用的内核。",q:"https://pan.quark.cn/s/f837eb774271",x:"https://pan.xunlei.com/s/VP2rcy0N_JlqbnaHmcHC_y-rA1?pwd=b8tj#",t:""},
 {n:"通用调度",d:"🐷包自己调的。",q:"https://pan.quark.cn/s/2b71b4b240c6",x:"https://pan.xunlei.com/s/VP2rdZaRlLNA_4rKqfD_PY-FA1?pwd=v25c#",t:""},
 {n:"通用隐藏",d:"通用 root 环境隐藏。",q:"https://pan.quark.cn/s/c7b3cb37b761",x:"https://pan.xunlei.com/s/VP2rdgr3oml32u08hZ3yCviVA1?pwd=7tnb#",t:""}
];
function bt(u,l,c){return u?'<a class="btn '+c+'" href="'+u+'" target="_blank" rel="noopener">'+l+'</a>':'<button class="btn off">'+l+'（待添加）</button>'}
var box='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>';
var list=document.getElementById('list'),toast=document.getElementById('toast'),tm,els=[];
function say(s){toast.textContent=s;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on')},1600)}
items.forEach(function(it,i){
  var el=document.createElement('div');el.className='row'+(i===0?' open':'');
  el.innerHTML='<button class="top" aria-expanded="'+(i===0)+'"><span class="ic">'+box+'</span><span>'+it.n+'</span><span class="tags"><span class="tag">夸克</span><span class="tag">迅雷</span>'+(it.t?'<span class="tag">教程</span>':'')+'</span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button><div class="pn"><div><p class="desc">'+it.d+'</p><div class="btns">'+bt(it.q,"夸克网盘","p")+bt(it.x,"迅雷网盘","p")+bt(it.t,"模块教程","")+'</div></div></div>';
  var t=el.querySelector('.top');
  t.onclick=function(){var o=el.classList.toggle('open');t.setAttribute('aria-expanded',o)};
  el.querySelectorAll('.btn.off').forEach(function(b){b.onclick=function(){say('教程还没添加')}});
  list.appendChild(el);els.push({el:el,n:it.n});
});
document.getElementById('cnt').textContent=items.length+' 项';
document.getElementById('q').oninput=function(){
  var v=this.value.trim().toLowerCase(),c=0;
  els.forEach(function(x){var m=!v||x.n.toLowerCase().indexOf(v)>-1;x.el.style.display=m?'':'none';if(m)c++});
  document.getElementById('em').style.display=c?'none':'block';
  document.getElementById('cnt').textContent=c+' 项';
};
document.getElementById('qq').onclick=function(){
  try{navigator.clipboard.writeText('3048482062').then(function(){say('QQ号已复制')},function(){say('QQ: 3048482062')})}catch(e){say('QQ: 3048482062')}
};
var root=document.documentElement;
function setTheme(t,save){root.setAttribute('data-theme',t);if(save){try{localStorage.setItem('jh-theme',t)}catch(e){}}}
var st=null;try{st=localStorage.getItem('jh-theme')}catch(e){}
setTheme(st||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),false);
document.getElementById('tb').onclick=function(){var n=root.getAttribute('data-theme')==='light'?'dark':'light';setTheme(n,true);say(n==='light'?'已切换到日间模式':'已切换到夜间模式')};
var sd=document.getElementById('sd'),sc=document.getElementById('sc');
function tg(o){sd.classList.toggle('on',o);sc.classList.toggle('on',o)}
document.getElementById('mb').onclick=function(){tg(!sd.classList.contains('on'))};
sc.onclick=function(){tg(false)};
document.querySelectorAll('.nav a').forEach(function(a){a.onclick=function(){
  document.querySelectorAll('.nav a').forEach(function(x){x.classList.remove('cur')});a.classList.add('cur');tg(false)}});
var secs=['top','res','contact','about'].map(function(id){return document.getElementById(id)});
var links=document.querySelectorAll('.nav a');
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=secs.indexOf(e.target);links.forEach(function(x,k){x.classList.toggle('cur',k===i)})}})},{rootMargin:'-30% 0px -60% 0px'});secs.forEach(function(x){io.observe(x)})}
</script>
</body>
</html>
